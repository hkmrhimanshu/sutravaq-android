name: Build SUTRAVAQ APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Files & Auto-Fix Syntax
        run: |
          # 1. Unzip
          unzip -o *.zip || true

          # 2. Support both folder names
          if [ -d "sutravaq-android-project" ]; then
            cp -r sutravaq-android-project/* .
          fi
          if [ -d "sutravaq-android" ]; then
            cp -r sutravaq-android/* .
          fi

          # 3. Fallback: auto-detect project root
          if [ ! -f "settings.gradle.kts" ]; then
            SETTINGS_PATH=$(find . -name "settings.gradle.kts" | head -n 1)
            if [ -n "$SETTINGS_PATH" ]; then
              PROJECT_FOLDER=$(dirname "$SETTINGS_PATH")
              cp -r "$PROJECT_FOLDER"/* .
            fi
          fi

          # 4. Clean any escaped quote syntax in Kotlin files
          find . -name "*.kt" -exec sed -i 's/\\\"/\"/g' {} + 2>/dev/null || true

          # 5. Auto-fix dependency version numbers
          find . -name "build.gradle.kts" -exec sed -i 's/room-runtime:"/room-runtime:2.6.1"/g' {} +
          find . -name "build.gradle.kts" -exec sed -i 's/room-ktx:"/room-ktx:2.6.1"/g' {} +
          find . -name "build.gradle.kts" -exec sed -i 's/room-compiler:"/room-compiler:2.6.1"/g' {} +
          find . -name "build.gradle.kts" -exec sed -i 's/camera-core:"/camera-core:1.3.1"/g' {} +
          find . -name "build.gradle.kts" -exec sed -i 's/camera-camera2:"/camera-camera2:1.3.1"/g' {} +
          find . -name "build.gradle.kts" -exec sed -i 's/camera-lifecycle:"/camera-lifecycle:1.3.1"/g' {} +
          find . -name "build.gradle.kts" -exec sed -i 's/camera-view:"/camera-view:1.3.1"/g' {} +

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Official Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sutravaq-debug-apk
          path: "**/outputs/apk/debug/*.apk"
          
