name: Build SUTRAVAQ APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract SUTRAVAQ Project
        run: |
          unzip -o *.zip || true
          if [ -d "sutravaq-android" ]; then
            cp -rn sutravaq-android/* . || cp -r sutravaq-android/* .
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Official Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sutravaq-debug-apk
          path: "**/outputs/apk/debug/*.apk"
          
