name: Build SUTRAVAQ APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Clean Project
        run: |
          unzip -o sutravaq-android.zip
          cp -r sutravaq-android/* .
          chmod +x gradlew

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Official Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace --console=plain 2>&1 | tee build.log || true
          
          if ! grep -q "BUILD SUCCESSFUL" build.log; then
            echo "## ❌ Compilation Failure Details" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "^e: " build.log | head -n 30 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sutravaq-debug-apk
          path: "**/outputs/apk/debug/*.apk"
          
